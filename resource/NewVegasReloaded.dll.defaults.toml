[_Shaders.Skin.Debug]
DebugView = 0                       # Skin diagnostics, indoors and out. 0 off. 1 which pass drew the skin: green one full pass, cyan one full pass with several lamps, yellow a light-only pass the game multiplies by the texture afterwards, red added for every extra lamp pass on top (indoors skin usually goes yellow + red). 2 which settings are in use: blue Interiors, orange outdoors; bright where the screen-space blur takes the skin, dark where per-pixel diffusion stands in. 3 direct light (sun and lamps) on white skin. 4 ambient and sky light on white skin. 5 highlights alone. 6 material: red roughness, green highlight strength, blue the VanillaMatchedHighlights boost. 7 curvature: red per-pixel diffusion (PerPixelWidth), green thin features for Translucency. 8 the screen-space blur's skin test: green blurred, red rejected by distance, blue rejected by colour. 9 scene brightness against the skin's own pass: green equal, red brighter (extra lamp passes), blue darker. 10 what the blur changed: dark nothing, bright a lot.

