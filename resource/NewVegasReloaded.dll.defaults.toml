Format = 0							 # Texture format, higher means higher quality, but higher bandwidth cost. 0: 16 bit, 1: 32 bit
CascadeResolution = 1				 # Resolution used for shadow cascades. 0: 1024, 1: 1536, 2: 2048,
                                     # 3: 2560, 4: 3072, 5: 3584. The atlas holds 2x2 cascades, so
                                     # VRAM and shadow-pass bandwidth scale with the square of this:
                                     # 3 is ~2.6x the cost of 2, and 5 is ~5x. Clamped down if it
                                     # exceeds the device's maximum texture size.
Prefilter = true					 # Enable prefiltering the shadow maps. Prefiltering is a blur.
MSAA = true							 # Enable multisample antialiasing for shadow maps.
Mipmaps = false						 # DISABLED. Enable mipmaps for the shadow maps.
Anisotropy = 0						 # DISABLED. Anisotropic filteric for mipmaps, 0: disabled, 1: 8x, 2: 16x
Distance = 6000                      # Distance to render shadows for. The unit is the same as the game uses for i.e. fog values. 
CascadeLambda = 0.9					 # [0.0-1.0] Controls how cascades are split, higher value means nearer cascades get higher resolution.
LimitFrequency = true				 # Limit the update frequency of the furthest cascade (once per four frames).
CasterCulling = true				 # Skip shadow casters whose shadow cannot fall anywhere you can see (e.g. behind you with the sun in front). Saves shadow-map draw calls. Not applied to the furthest cascade while LimitFrequency is on.
CasterMargin = 256.0				 # [0.0-4096.0] Game units added around the view when deciding, so shadows at the screen edges and in blurred cascade borders stay.
CasterDrop = 2048.0				 # [0.0-65536.0] How far below an object its shadow is followed (terrain dropping away). Larger is safer, culls less.
Instancing = true					 # Draw copies of the same mesh (rocks, posts, walls) into the sun's shadow maps together, one draw call per mesh instead of one per copy (hardware instancing).
SkipCoveredCasters = true			 # Leave a caster out of a cascade when its whole shadow falls where an earlier (sharper) cascade already answers for every pixel. Nearby NPCs and objects were drawn into the near, middle and far maps alike.

