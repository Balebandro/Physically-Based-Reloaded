RoughnessScale = 1.0               # [1.0-2.0] Multiplies the roughness of materials with an _rmaos map (their R channel): 1 as authored, 2 twice as rough. Never glossier than the map. The result stays at most 1. OpenPBR lighting only (LightingModel 0): Anomaly lighting ignores it.

[_Shaders.PBR.Status]
Enabled = true                       # Object lighting as Community Shaders: true PBR for materials with an authored _rmaos map (R roughness, G metalness, B AO, A specular, next to the diffuse texture), vanilla shading for the rest.

[_Shaders.DynamicCubemaps.Main]
DebugView = 0                        # Shows the dynamic cubemap over the screen: 0 off, 1 panorama (the whole environment cube unwrapped, looking around horizontally across the screen, up at the top), 2 mirror (every surface reflects the cube like a perfect mirror: what PBR materials would reflect there), 3 coverage (panorama of what the cube has actually seen: white is captured from the screen, black is filled in from the sky or the room's light).
DebugRoughness = 0.0                 # [0.0-1.0] Which blur level DebugView 1 and 2 show: 0 the sharp mirror image, 1 the blurriest (what a fully rough material reflects).
KeepDistance = 2000.0                # Game units, as Community Shaders: out of view, a reflection is kept while the camera stays within this distance of the surface it captured, however you turn or move, and fades once you are farther (fully at half as far again) or right up against it. Surfaces captured farther than this, and the sky, are always kept.
DropTime = 1.0                       # [0.05-30] Seconds for an out-of-range reflection to fade to about a third.
StaleHalfLife = 0.0                  # Seconds for anything out of view to fade to half regardless of distance, so changed light (a lamp switched off) clears out eventually. 0 never, as in Community Shaders.

[_Shaders.DynamicCubemaps.Status]
Enabled = true                       # What authored PBR materials (_rmaos) reflect, as Community Shaders' Dynamic Cubemaps: every frame the screen is projected into a cubemap around the camera, which fills in as you look around, and is blurred into one level per roughness. Directions never seen show the sky outdoors and the room's light indoors. Off, they reflect only the sky outdoors and the ambient light indoors. Costs well under a millisecond (256 px cubes). The game's own env map is drawn on top of them as well while [Shaders.PBR.Main] VanillaEnvMapOnPBR is on.

