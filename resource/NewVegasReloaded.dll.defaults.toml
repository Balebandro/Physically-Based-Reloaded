PuddleOverride = -1.0               # [-1.0-1.0] Force the puddle wetness. -1 off.
RainOverride = -1.0                 # [-1.0-1.0] Force the rain intensity (ripples). -1 off.
ShowCover = false                   # Debug view of what counts as under cover: green open to the sky, red covered, yellow outside the top-down map (counted open), blue no map, dark blue land with no map slot.

[_Shaders.WetnessEffects.Status]
Enabled = true                      # Wetness Effects (from Community Shaders): in the rain surfaces darken and gain a glossy water film, puddles form on flat ground, drops ripple on the ground, nothing under cover gets wet, ground by the water stays wet; things dry after the rain. Uses the top-down ortho map ([Shaders.ShadowsExteriors.Ortho]) for cover: Resolution 2 or more keeps porches and roofs dry.

[_Shaders.WetnessReflections.Main]
Strength = 1.0                      # [0.0-2.0] How much of what wet surfaces reflect comes from the scene on screen instead of the sky.
MaxDistance = 1500.0                # [100-10000] How far a reflected ray looks, in game units. Longer finds farther things, at more cost per step.
Thickness = 30.0                    # [1-500] How far behind a surface on screen a ray may pass and still count as hitting it. Too low and thin things go missing; too high and reflections smear under objects.
Steps = 24                          # [4-64] Ray steps per wet pixel. More is finer and costs more.
RoughnessCutoff = 0.5               # [0.05-1.0] Water films rougher than this reflect only the sky (fading in from half of it). Puddles are the smoothest.
EdgeFade = 0.1                      # [0.01-0.5] Reflections fade out near the screen's edges, over this share of the screen, where what they show runs out.
MaxCameraDistance = 4000.0          # [500-50000] No screen-space reflections on wet surfaces farther than this from the camera.
DebugView = false                   # Shows the reflections alone.

[_Shaders.WetnessReflections.Status]
Enabled = true                      # Screen-space reflections on Wetness Effects' water film and puddles: wet ground and objects reflect what is around them on screen, not just the sky. Needs Wetness Effects on.
