RenderEffects = true        # Toggle rendering of all effects.
RenderPreTonemapping = true # Toggle rendering of some effects in HDR before the game image space effects (can cause glitches).
ReplaceIntro = false        # Controls rendering of the main menu custom video.
ScreenshotKey = 87          # Keycode for custom screenshot hotkey (removes HUD and saves as jpg).
HDRScreenshot = false       # Save screenshots in fbx (use with DXVK HDR)
PresetManagerEnabled = false # Master toggle for automatic per-location Preset Manager resolution. Off = your own settings are authoritative; Save/Load/Delete in the Preset Manager panel still work. Defaults off: it silently wins the location-based settings that third-party tools like Cartographer -- which this feature supersedes -- also try to control, so turn it on deliberately once you're not running one of those alongside it.

[_Main.Main.FrameCounter]
Enabled = false             # Shows frames per second in a corner of the screen (green 60 and up, yellow from 30, red below), averaged over half a second. Works with the settings menu closed.
Position = 0                # [0-3] Corner: 0 top left, 1 top right, 2 bottom left, 3 bottom right.
Detailed = false            # Also shows the average frame time and the slowest frame of each half second, which reveals stutters the average hides.

[_Main.Main.DrawProfiler]
Enabled = false             # Draw call profiler: how many draw calls and primitives each frame sends to the graphics card, split by what is being drawn (world, first person, water reflections, shadow maps, NVR's effects, the game's image space, interface, overlay, other) and by pixel shader. Averaged over half a second, shown under the frame counter. Costs a little CPU while on.
Position = 0                # [0-3] Corner: 0 top left, 1 top right, 2 bottom left, 3 bottom right.
TopShaders = 10             # [0-30] How many pixel shaders to list, the most drawn first. NVR's shaders by name (the game's own marked vanilla); effects' shaders show as unnamed.
LogInterval = 0.0           # Seconds between copies of the numbers in NewVegasReloaded.log, to compare setups afterwards. 0 off.

[_Main.Main.Audio]
ListenerRate = 30.0         # [0.0-240.0] How many times a second the game refreshes where you are hearing from (DirectSound recomputes every playing 3D sound each time). The game does it every frame, costly in busy fights. 30 is inaudible; 0 restores every frame.
SkipRedundantVolume = true  # Sounds set their volume every frame, mostly to the volume they already have, and each call waits on DirectSound. Unchanged volumes are not sent again.

[_Main.Main.Precipitations]
RemovePrecipitations = false   # Disables vanilla rain and other precipitations: the weather's own rain and snow, and the rain meshes rain scripts place on the player (3D Rain, Honest Hearts, Climate Control: [Shaders.Precipitations.Particles] RainMeshRoots). Takes effect immediately, no restart.

[_Main.Main.Water]
ForceReflections = true     # Always render the full world in reflection for HD reflections.
RemoveUnderwater = false    # Disables fog underwater. Not compatible with custom underwater shader.

[_Main.Main.ReducedQuality]
CheapReflections = true      # The water reflection is drawn without NVR's sun shadows and without terrain parallax, like the game's own reflections. Objects and ground seen in the water lose their sun shadows and bumps; the game blurs the reflection, so the difference is usually small. Only where water is in view. From NVR UNOFFICIAL Optimized.

