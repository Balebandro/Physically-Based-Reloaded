RainMeshDensity = 1.0                # [0.1-1.0] The share of the rain mesh's particles drawn. Rain filling the screen costs mostly in overdraw: 0.5 draws half the drops for about half the cost. Applies to every copy of the rain mesh drawn while NVR's own is on.
